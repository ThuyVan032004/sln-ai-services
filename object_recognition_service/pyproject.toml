[project]
name = "object_recognition_service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "cloudpickle==3.1.1",
    "dependency-injector>=4.49.1",
    "fastapi>=0.139.0",
    "mlflow>=3.14.0",
    "pillow>=12.3.0",
    "python-cqrs>=4.10.3",
    "python-multipart>=0.0.32",
    "shared",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
    "onnxruntime>=1.29.0",
    "ultralytics>=8.4.138",
    "onnx>=1.22.0",
    "polars[rtcompat]>=1.44.1",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }  

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
